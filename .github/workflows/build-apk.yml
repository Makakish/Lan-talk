
name: Build LAN TALK APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o LanTalk-source.zip -d .

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("LanTalk/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              '    compileSdk = 35',
              '''    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }'''
          )

          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd LanTalk
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAN-TALK-APK
          path: LanTalk/app/build/outputs/apk/debug/app-debug.apk
          
